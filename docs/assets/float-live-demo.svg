<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#111A30"/>
      <stop offset="100%" stop-color="#1A2639"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace; }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
      @keyframes slideIn1 {
        0%, 10% { opacity: 0; transform: translateY(6px); }
        20%, 100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes slideIn2 {
        0%, 32% { opacity: 0; transform: translateY(6px); }
        45%, 100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes slideIn3 {
        0%, 58% { opacity: 0; transform: translateY(6px); }
        72%, 100% { opacity: 1; transform: translateY(0); }
      }
      .step1 { animation: slideIn1 8s infinite; }
      .step2 { animation: slideIn2 8s infinite; }
      .step3 { animation: slideIn3 8s infinite; }
      .live-dot { animation: pulseGlow 2s infinite; }
    </style>
  </defs>

  <!-- Outer Window Frame -->
  <rect width="960" height="500" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Titlebar -->
  <rect width="960" height="44" rx="16" fill="#0F172A"/>
  <rect y="28" width="960" height="16" fill="#0F172A"/>
  <line x1="0" y1="44" x2="960" y2="44" stroke="#1E293B" stroke-width="1"/>

  <!-- macOS Traffic Lights -->
  <circle cx="24" cy="22" r="6.5" fill="#EF4444"/>
  <circle cx="44" cy="22" r="6.5" fill="#F59E0B"/>
  <circle cx="64" cy="22" r="6.5" fill="#10B981"/>

  <!-- Window Title -->
  <text x="480" y="27" text-anchor="middle" fill="#94A3B8" font-size="13" font-weight="600" class="font">
    Float 1.0.3 ? Counter Desk #04 (Assigned Desk: 10.0.0.42) ? Windows &amp; macOS
  </text>

  <!-- Live Status Pill -->
  <rect x="815" y="11" width="125" height="22" rx="11" fill="#064E3B" stroke="#059669" stroke-width="1"/>
  <circle cx="829" cy="22" r="4" fill="#34D399" class="live-dot"/>
  <text x="840" y="26" fill="#A7F3D0" font-size="11" font-weight="600" class="mono">STDLIB ? &lt;0.3s</text>

  <!-- Left Sidebar (Desk Queue & Fleet) -->
  <rect x="0" y="45" width="230" height="455" rx="0" fill="#0B1120"/>
  <line x1="230" y1="45" x2="230" y2="500" stroke="#1E293B" stroke-width="1"/>

  <text x="18" y="75" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1" class="font">LIVE COUNTER WORKFLOWS</text>

  <rect x="12" y="88" width="206" height="36" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="26" y="111" fill="#F8FAFC" font-size="12.5" font-weight="600" class="font">?? 1. Instant Quote &amp; Bill</text>

  <rect x="12" y="130" width="206" height="34" rx="8" fill="#111827"/>
  <text x="26" y="152" fill="#94A3B8" font-size="12" class="font">?? 2. Rental Agreement</text>

  <rect x="12" y="170" width="206" height="34" rx="8" fill="#111827"/>
  <text x="26" y="192" fill="#94A3B8" font-size="12" class="font">?? 3. Handover Checklist</text>

  <rect x="12" y="210" width="206" height="34" rx="8" fill="#111827"/>
  <text x="26" y="232" fill="#94A3B8" font-size="12" class="font">?? 4. Damage &amp; Deposit Claim</text>

  <rect x="12" y="250" width="206" height="34" rx="8" fill="#111827"/>
  <text x="26" y="272" fill="#94A3B8" font-size="12" class="font">?? 5. Fleet Revenue Analyzer</text>

  <text x="18" y="314" fill="#64748B" font-size="11" font-weight="700" letter-spacing="1" class="font">TODAY'S SHIFT QUEUE</text>
  <rect x="12" y="326" width="206" height="52" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="24" y="346" fill="#E2E8F0" font-size="12" font-weight="600" class="font">Innova Crysta ? KA-01-AB-4421</text>
  <text x="24" y="365" fill="#F59E0B" font-size="11" class="mono">Return Check-in ? Bay 2</text>

  <rect x="12" y="386" width="206" height="52" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="24" y="406" fill="#E2E8F0" font-size="12" font-weight="600" class="font">Creta SX ? MH-12-PQ-9081</text>
  <text x="24" y="425" fill="#38BDF8" font-size="11" class="mono">Airport Pickup ? 19:00</text>

  <!-- Main Workspace Area -->
  <!-- Step 1: Operator Prompt -->
  <g class="step1">
    <rect x="256" y="64" width="678" height="68" rx="12" fill="#1E293B" stroke="#334155"/>
    <text x="276" y="88" fill="#F59E0B" font-size="11" font-weight="700" class="mono">COUNTER OPERATOR PROMPT</text>
    <text x="276" y="112" fill="#F8FAFC" font-size="13.5" class="font">
      "Innova Crysta KA-01-AB-4421 returned after 4 days (1,480 km driven, 1,200 km free). ?3,500/day, ?18/extra km,
    </text>
    <text x="276" y="127" fill="#CBD5E1" font-size="12.5" class="font">
      ?1,400 FASTag tolls, ?15,000 security deposit paid. Settle bill with 5% GST and generate PDF + WhatsApp."
    </text>
  </g>

  <!-- Step 2: Deterministic Tool Execution & Tariff Breakdown Card -->
  <g class="step2">
    <rect x="256" y="148" width="678" height="232" rx="12" fill="#0F172A" stroke="#059669" stroke-width="1.5"/>
    <rect x="256" y="148" width="678" height="36" rx="12" fill="#064E3B"/>
    <text x="276" y="171" fill="#A7F3D0" font-size="12" font-weight="700" class="mono">
      ? TOOL EXECUTED: calculate_quote (Deterministic Tariff &amp; GST Engine ? 0 Hallucinations)
    </text>

    <!-- Left Column of Breakdown -->
    <text x="278" y="210" fill="#94A3B8" font-size="12.5" class="font">Base Rental (4 Days ? ?3,500)</text>
    <text x="560" y="210" text-anchor="end" fill="#F8FAFC" font-size="13" font-weight="600" class="mono">?14,000.00</text>

    <text x="278" y="236" fill="#94A3B8" font-size="12.5" class="font">Extra Distance (280 km ? ?18/km)</text>
    <text x="560" y="236" text-anchor="end" fill="#F8FAFC" font-size="13" font-weight="600" class="mono">?5,040.00</text>

    <text x="278" y="262" fill="#94A3B8" font-size="12.5" class="font">FASTag / Highway Tolls (Actuals)</text>
    <text x="560" y="262" text-anchor="end" fill="#F8FAFC" font-size="13" font-weight="600" class="mono">?1,400.00</text>

    <text x="278" y="288" fill="#94A3B8" font-size="12.5" class="font">GST @ 5% (2.5% CGST + 2.5% SGST)</text>
    <text x="560" y="288" text-anchor="end" fill="#F8FAFC" font-size="13" font-weight="600" class="mono">?952.00</text>

    <line x1="278" y1="304" x2="560" y2="304" stroke="#334155" stroke-width="1"/>

    <text x="278" y="328" fill="#E2E8F0" font-size="13.5" font-weight="700" class="font">Grand Total Invoice</text>
    <text x="560" y="328" text-anchor="end" fill="#34D399" font-size="14.5" font-weight="700" class="mono">?21,392.00</text>

    <text x="278" y="356" fill="#F59E0B" font-size="13" font-weight="700" class="font">Less Security Deposit Held (?15,000)</text>
    <text x="560" y="356" text-anchor="end" fill="#FBBF24" font-size="14" font-weight="700" class="mono">Balance Due: ?6,392.00</text>

    <!-- Right Column Summary Box -->
    <rect x="595" y="198" width="318" height="164" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="615" y="222" fill="#38BDF8" font-size="11.5" font-weight="700" class="mono">WHATSAPP SETTLEMENT READY</text>
    <text x="615" y="246" fill="#E2E8F0" font-size="12" class="font">?? Thank you for riding with Float!</text>
    <text x="615" y="268" fill="#CBD5E1" font-size="11.5" class="font">? Vehicle: Innova Crysta (KA-01-AB-4421)</text>
    <text x="615" y="288" fill="#CBD5E1" font-size="11.5" class="font">? Bill Total: ?21,392 (incl. 280 extra km)</text>
    <text x="615" y="308" fill="#CBD5E1" font-size="11.5" class="font">? Deposit Adjusted: ?15,000</text>
    <text x="615" y="332" fill="#34D399" font-size="12.5" font-weight="700" class="font">?? Net Payable at Desk: ?6,392.00</text>
  </g>

  <!-- Step 3: Instant Generated Deliverables Bar -->
  <g class="step3">
    <rect x="256" y="396" width="678" height="82" rx="12" fill="#1E293B" stroke="#475569"/>
    <text x="276" y="420" fill="#94A3B8" font-size="11" font-weight="700" class="mono">
      GENERATED FILES SAVED LOCALLY (CLICK TO DOWNLOAD OR SAVE TO DESKTOP):
    </text>

    <rect x="276" y="432" width="195" height="32" rx="7" fill="url(#goldGrad)"/>
    <text x="373" y="453" text-anchor="middle" fill="#0F172A" font-size="12" font-weight="700" class="font">
      ?? Tax_Invoice_4421.pdf
    </text>

    <rect x="484" y="432" width="205" height="32" rx="7" fill="#2563EB"/>
    <text x="586" y="453" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" class="font">
      ?? Return_Handover.docx
    </text>

    <rect x="702" y="432" width="210" height="32" rx="7" fill="url(#emeraldGrad)"/>
    <text x="807" y="453" text-anchor="middle" fill="#052E16" font-size="12" font-weight="700" class="font">
      ?? Trip_Ledger_Row.xlsx
    </text>
  </g>
</svg>
