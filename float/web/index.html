<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Float</title>
<meta name="theme-color" content="#151515">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231E3A32'/><circle cx='22' cy='11' r='3.2' fill='%23E8A33D'/></svg>">
</head>
<body>

<!-- Float is driving the computer. Hard to miss, easy to stop. -->
<div class="driving" id="driving" hidden>
  <span class="ring"></span>
  <span class="spacer col"><b id="driving-what">Float is using your computer</b><small id="driving-step"></small></span>
  <button class="btn ghost" id="driving-stop">Stop &nbsp;<kbd>Esc</kbd></button>
</div>

<div class="shell">

  <!-- ------------------------------------------------------------- rail -->
  <nav class="rail" id="rail" aria-label="Your work">
    <div class="rail-top">
      <div class="wordmark">Float<span class="wordmark-dot"></span></div>
      <div class="school-tag" id="school-tag"></div>
    </div>

    <button class="rail-new" id="new-thread">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      New conversation
    </button>

    <div class="rail-nav">
      <button class="rail-link" data-panel="toolkit">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Toolkit <span class="count" id="count-kit"></span>
      </button>
      <button class="rail-link" data-panel="classes">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="5.5" cy="6" r="2.2" stroke="currentColor" stroke-width="1.3"/><circle cx="11" cy="6.6" r="1.7" stroke="currentColor" stroke-width="1.3"/><path d="M1.8 13c.4-2.2 1.9-3.3 3.7-3.3S8.8 10.8 9.2 13M9.8 9.9c1.6-.3 3.2.6 3.6 3.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Classes <span class="count" id="count-classes"></span>
      </button>
      <button class="rail-link" data-panel="tasks">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M3 8.4 6 11.4 13 4.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        To do <span class="count" id="count-tasks"></span>
      </button>
      <button class="rail-link" data-panel="files">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M3.5 2h5l4 4v8H3.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8.5 2v4h4" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        Files <span class="count" id="count-files"></span>
      </button>
    </div>

    <div class="rail-heading">Recent</div>
    <div class="rail-scroll" id="threads"></div>

    <div class="rail-foot">
      <button class="rail-foot-name" id="open-settings">
        <span class="avatar" id="me-avatar">T</span>
        <span class="grow">
          <b id="me-name">Teacher</b>
          <small id="me-sub">Settings</small>
        </span>
      </button>
      <button class="icon-btn" id="open-admin" title="Admin panel" hidden aria-label="Admin panel">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 1.8 13.5 4v4c0 3-2.3 5.3-5.5 6.2C4.8 13.3 2.5 11 2.5 8V4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="sign-out" title="Sign out" aria-label="Sign out">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M6 2.5H3.2v11H6M9.5 8h5M12.3 5.6 14.7 8l-2.4 2.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </nav>

  <!-- ------------------------------------------------------------- main -->
  <main class="main">

    <header class="topbar">
      <div class="nav-cluster">
        <button class="icon-btn" id="open-menu" data-pop aria-label="Menu" title="Menu">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="rail-toggle" aria-label="Show or hide the sidebar" title="Sidebar">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M6.2 2.8v10.4" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <button class="icon-btn" id="nav-back" aria-label="Back" title="Back" disabled>
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M13 8H3.2M7.6 3.6 3.2 8l4.4 4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <button class="icon-btn" id="nav-forward" aria-label="Forward" title="Forward" disabled>
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 8h9.8M8.4 3.6 12.8 8l-4.4 4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
      </div>

      <div class="chip" id="chip-thread" hidden><span id="chip-thread-title"></span></div>
      <span class="spacer"></span>
    </header>

    <div class="notice-strip" id="notice-strip" hidden></div>

    <div class="stream" id="stream">
      <div class="column">

      <!-- The welcome. Rendered once per sign-in, then it scrolls away. -->
      <section class="greeting" id="greeting">
        <h2 id="g-headline">Hello.</h2>
        <p class="detail" id="g-detail"></p>

        
      </section>

        <div id="turns"></div>
      </div>
    </div>

    <!-- --------------------------------------------------------- composer -->
    <div class="composer-wrap">
      <div class="composer">
        <div class="composer-bar" id="attach-bar" hidden></div>
        <textarea id="input" rows="1" placeholder="How can I help you today?"
                  aria-label="Message Float"></textarea>
        <div class="composer-bar">
          <button class="icon-btn plus" id="attach" data-pop title="Add a photo or file, or open the toolkit" aria-label="Add">
            <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <input type="file" id="file-input" hidden multiple
                 accept="image/*,.pdf,.txt,.md,.csv">
          <span class="spacer"></span>
          <span class="composer-note" id="composer-note"></span>
          <button class="pick" id="chip-assist" title="How much Float does for you"><span id="assist-label">Draft it</span></button>
          <button class="pick" id="chip-model" title="Which model answers you"><span id="model-label">No key yet</span></button>
          <button class="icon-btn" id="mic" title="Dictate" aria-label="Dictate" hidden>
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="5.7" y="1.8" width="4.6" height="8" rx="2.3" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M3.4 7.6a4.6 4.6 0 0 0 9.2 0M8 12.2v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg>
          </button>
          <button class="send" id="send" aria-label="Send">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 13V3M3.6 7.2 8 2.8l4.4 4.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </button>
        </div>
      </div>
      <div class="home-extras" id="home-extras">
        <div class="starters">
          <button class="starter" data-prompt="Using my computer, open my Google Drive and find ">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M8.2 3h7.6l6.2 10.8h-7.6z" fill="#FFBA00"/><path d="M8.2 3 2 13.8l3.8 6.6L12 9.6z" fill="#1EA362"/><path d="M5.8 20.4h12.4l3.8-6.6H9.6z" fill="#4285F4"/></svg>
            From Drive
          </button>
          <button class="starter" data-prompt="Using my computer, open my Google Calendar and tell me what is coming up ">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3.5" fill="#4285F4"/><rect x="6" y="7.2" width="12" height="11" rx="1.6" fill="#fff"/><text x="12" y="16.1" font-size="7.6" text-anchor="middle" fill="#4285F4" font-family="Arial, sans-serif" font-weight="700">31</text></svg>
            From Calendar
          </button>
          <button class="starter" data-prompt="Using my computer, open my Gmail and look for ">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.2" fill="#F1F1F1"/><path d="M3.4 6.6 12 13l8.6-6.4" fill="none" stroke="#EA4335" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/></svg>
            From Gmail
          </button>
        </div>
        <div class="reflection" id="reflection" hidden>
          <b>This week</b>
          <span id="reflection-text"></span>
        </div>
      </div>
      <p class="composer-note">
        Float can be wrong about syllabus detail and page numbers. Your judgement is the point.
      </p>
    </div>
  </main>

  <!-- ------------------------------------------------------------ drawer -->
  <div class="scrim" id="drawer-scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="Panel">
    <div class="drawer-head">
      <h3 id="drawer-title">Toolkit</h3>
      <span class="spacer"></span>
      <button class="icon-btn" id="drawer-close" aria-label="Close">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
</div>

<!-- -------------------------------------------------------------- modals -->
<div class="modal-scrim" id="modal-scrim" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h3 id="modal-title">Settings</h3>
      <span class="spacer"></span>
      <button class="icon-btn" id="modal-close" aria-label="Close">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
