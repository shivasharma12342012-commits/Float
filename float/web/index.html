<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Float · Fleet &amp; Rental Operations</title>
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/float.ico">
<script src="/splash.js"></script>
</head>
<body>

<!-- Float is driving the computer. Hard to miss, easy to stop. -->
<div class="driving" id="driving" hidden>
  <span class="ring"></span>
  <span class="spacer col"><b id="driving-what">Float is using your computer</b><small id="driving-step"></small></span>
  <button class="btn ghost" id="driving-stop">Stop &nbsp;<kbd>Esc</kbd></button>
</div>

<div class="shell">

  <!-- ------------------------------------------------------------- rail -->
  <nav class="rail" id="rail" aria-label="Your work">
    <div class="rail-top">
      <div class="wordmark" title="Float">
        <img class="wm-logo" src="/float.ico" alt=""><span class="wm-text">Float</span>
        <div class="float-mascot" id="float-mascot" role="button" tabindex="0" title="Float Mascot Buddy" aria-label="Float Mascot Buddy" aria-describedby="mascot-bubble" data-mascot-ready="true">
          <div class="mascot-bubble" id="mascot-bubble" role="status" aria-live="polite"></div>
          <div class="mascot-sprite" id="mascot-sprite">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" class="mascot-svg" shape-rendering="crispEdges" aria-hidden="true">
              <!-- Headphones Headband -->
              <g class="mascot-headband">
                <rect x="7" y="2" width="10" height="1" fill="#1e3a8a"/>
                <rect x="6" y="3" width="1" height="1" fill="#1e3a8a"/>
                <rect x="17" y="3" width="1" height="1" fill="#1e3a8a"/>
                <rect x="5" y="4" width="1" height="1" fill="#1e3a8a"/>
                <rect x="18" y="4" width="1" height="1" fill="#1e3a8a"/>
                <rect x="7" y="3" width="1" height="1" fill="#60a5fa"/>
                <rect x="8" y="3" width="8" height="1" fill="#3b82f6"/>
                <rect x="16" y="3" width="1" height="1" fill="#60a5fa"/>
                <rect x="6" y="4" width="1" height="1" fill="#3b82f6"/>
                <rect x="17" y="4" width="1" height="1" fill="#3b82f6"/>
              </g>
              <!-- Feet -->
              <g class="mascot-feet">
                <rect x="8" y="18" width="2" height="2" fill="#14532d"/>
                <rect x="14" y="18" width="2" height="2" fill="#14532d"/>
              </g>
              <!-- Squarish Green Body -->
              <g class="mascot-body">
                <rect x="6" y="5" width="12" height="1" fill="#14532d"/>
                <rect x="6" y="17" width="12" height="1" fill="#14532d"/>
                <rect x="5" y="6" width="1" height="11" fill="#14532d"/>
                <rect x="18" y="6" width="1" height="11" fill="#14532d"/>
                <rect x="6" y="6" width="1" height="1" fill="#86efac"/>
                <rect x="7" y="6" width="11" height="1" fill="#4ade80"/>
                <rect x="6" y="7" width="1" height="9" fill="#4ade80"/>
                <rect x="7" y="7" width="10" height="9" fill="#22c55e"/>
                <rect x="17" y="7" width="1" height="10" fill="#16a34a"/>
                <rect x="7" y="16" width="10" height="1" fill="#16a34a"/>
                <rect x="9" y="14" width="6" height="2" fill="#34d399"/>
              </g>
              <!-- Face Details -->
              <g class="mascot-face">
                <!-- Normal Eyes -->
                <g class="mascot-eyes mascot-eyes-normal" id="mascot-eyes-normal">
                  <rect class="pupil-left-hi" x="8" y="8" width="1" height="1" fill="#ffffff"/>
                  <rect class="pupil-left-dark" x="9" y="8" width="1" height="1" fill="#0f172a"/>
                  <rect class="pupil-left-bot" x="8" y="9" width="2" height="1" fill="#0f172a"/>
                  <rect class="pupil-right-hi" x="14" y="8" width="1" height="1" fill="#ffffff"/>
                  <rect class="pupil-right-dark" x="15" y="8" width="1" height="1" fill="#0f172a"/>
                  <rect class="pupil-right-bot" x="14" y="9" width="2" height="1" fill="#0f172a"/>
                </g>
                <!-- Blinking Eyes -->
                <g class="mascot-eyes mascot-eyes-blink">
                  <rect x="8" y="9" width="2" height="1" fill="#14532d"/>
                  <rect x="14" y="9" width="2" height="1" fill="#14532d"/>
                </g>
                <!-- Happy Sparkly Eyes (Hover) -->
                <g class="mascot-eyes mascot-eyes-happy">
                  <rect x="8" y="8" width="2" height="1" fill="#0f172a"/>
                  <rect x="7" y="9" width="1" height="1" fill="#0f172a"/>
                  <rect x="10" y="9" width="1" height="1" fill="#0f172a"/>
                  <rect x="14" y="8" width="2" height="1" fill="#0f172a"/>
                  <rect x="13" y="9" width="1" height="1" fill="#0f172a"/>
                  <rect x="16" y="9" width="1" height="1" fill="#0f172a"/>
                </g>
                <!-- Rosy Blush Cheeks -->
                <g class="mascot-cheeks">
                  <rect x="7" y="11" width="1" height="1" fill="#fb7185"/>
                  <rect x="16" y="11" width="1" height="1" fill="#fb7185"/>
                </g>
                <!-- Normal Smile -->
                <g class="mascot-mouth mascot-mouth-normal">
                  <rect x="11" y="12" width="2" height="1" fill="#14532d"/>
                </g>
                <!-- Happy Smile (Hover) -->
                <g class="mascot-mouth mascot-mouth-happy">
                  <rect x="11" y="11" width="2" height="1" fill="#14532d"/>
                  <rect x="10" y="12" width="1" height="1" fill="#14532d"/>
                  <rect x="13" y="12" width="1" height="1" fill="#14532d"/>
                  <rect x="11" y="12" width="2" height="1" fill="#fda4af"/>
                  <rect x="11" y="13" width="2" height="1" fill="#14532d"/>
                </g>
              </g>
              <!-- Blue Headphones Earcups -->
              <g class="mascot-earcups">
                <!-- Left Earcup -->
                <rect x="2" y="6" width="3" height="1" fill="#1e3a8a"/>
                <rect x="2" y="11" width="3" height="1" fill="#1e3a8a"/>
                <rect x="1" y="7" width="1" height="4" fill="#1e3a8a"/>
                <rect x="2" y="7" width="2" height="4" fill="#2563eb"/>
                <rect x="2" y="8" width="1" height="2" fill="#93c5fd"/>
                <rect x="4" y="7" width="1" height="4" fill="#60a5fa"/>
                <!-- Right Earcup -->
                <rect x="19" y="6" width="3" height="1" fill="#1e3a8a"/>
                <rect x="19" y="11" width="3" height="1" fill="#1e3a8a"/>
                <rect x="22" y="7" width="1" height="4" fill="#1e3a8a"/>
                <rect x="20" y="7" width="2" height="4" fill="#2563eb"/>
                <rect x="21" y="8" width="1" height="2" fill="#93c5fd"/>
                <rect x="19" y="7" width="1" height="4" fill="#60a5fa"/>
              </g>
              <!-- Animated Musical Notes -->
              <g class="mascot-notes">
                <g class="mascot-note mascot-note-left">
                  <rect x="1" y="3" width="1" height="2" fill="#3b82f6"/>
                  <rect x="2" y="3" width="1" height="1" fill="#3b82f6"/>
                  <rect x="0" y="4" width="1" height="1" fill="#3b82f6"/>
                </g>
                <g class="mascot-note mascot-note-right">
                  <rect x="21" y="2" width="1" height="2" fill="#60a5fa"/>
                  <rect x="22" y="2" width="1" height="1" fill="#60a5fa"/>
                  <rect x="20" y="3" width="1" height="1" fill="#60a5fa"/>
                </g>
              </g>
            </svg>
          </div>
        </div>
      </div>
      <div class="school-tag" id="school-tag"></div>
    </div>

    <button class="rail-new" id="new-thread" data-tip="New task or quote" title="New task or quote">
      <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
      <span class="lbl">New task or quote</span>
    </button>

    <div class="rail-nav">
      <button class="rail-link" data-panel="toolkit" data-tip="Rental Toolkit">
        <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.2" y="2.2" width="4.6" height="4.6" rx="1.3"/><rect x="9.2" y="2.2" width="4.6" height="4.6" rx="1.3"/><rect x="2.2" y="9.2" width="4.6" height="4.6" rx="1.3"/><rect x="9.2" y="9.2" width="4.6" height="4.6" rx="1.3"/></svg>
        <span class="lbl">Toolkit</span> <span class="count" id="count-kit"></span>
      </button>
      <button class="rail-link" data-panel="classes" data-tip="Fleet &amp; Bookings">
        <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.2 9.5 3.6 5.2a1.4 1.4 0 0 1 1.3-.9h6.2c.6 0 1.1.4 1.3.9l1.4 4.3"/><rect x="1.6" y="9.2" width="12.8" height="3.8" rx="1.2"/><circle cx="4.4" cy="13.2" r="1.1"/><circle cx="11.6" cy="13.2" r="1.1"/></svg>
        <span class="lbl">Fleet</span> <span class="count" id="count-classes"></span>
      </button>
      <button class="rail-link" data-panel="tasks" data-tip="Ops checklist">
        <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5.8"/><path d="M5.4 8.2 7.2 10l3.5-3.9"/></svg>
        <span class="lbl">Ops to-do</span> <span class="count" id="count-tasks"></span>
      </button>
      <button class="rail-link" data-panel="files" data-tip="Contracts &amp; Files">
        <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4.7A1.7 1.7 0 0 1 3.7 3h2.8l1.5 1.7h4.3A1.7 1.7 0 0 1 14 6.4v5A1.7 1.7 0 0 1 12.3 13H3.7A1.7 1.7 0 0 1 2 11.4z"/></svg>
        <span class="lbl">Files</span> <span class="count" id="count-files"></span>
      </button>
    </div>

    <div class="rail-heading">Recent</div>
    <div class="rail-scroll" id="threads"></div>

    <div class="rail-foot">
      <button class="rail-foot-name" id="open-settings" data-tip="Settings" title="Settings">
        <span class="avatar" id="me-avatar">F</span>
        <span class="grow">
          <b id="me-name">Fleet Operator</b>
          <small id="me-sub">Settings</small>
        </span>
      </button>
      <button class="icon-btn" id="open-admin" title="Admin panel" hidden aria-label="Admin panel">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 1.8 13.5 4v4c0 3-2.3 5.3-5.5 6.2C4.8 13.3 2.5 11 2.5 8V4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="sign-out" title="Sign out" aria-label="Sign out">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M6 2.5H3.2v11H6M9.5 8h5M12.3 5.6 14.7 8l-2.4 2.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </nav>

  <!-- ------------------------------------------------------------- main -->
  <main class="main">

    <header class="topbar">
      <div class="nav-cluster">
        <button class="icon-btn" id="open-menu" data-pop aria-label="Menu" title="Menu">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" id="rail-toggle" aria-label="Collapse or expand the sidebar" aria-expanded="true" title="Collapse sidebar (Ctrl+B)">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M6.2 2.8v10.4" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <button class="icon-btn" id="nav-back" aria-label="Back" title="Back" disabled>
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M13 8H3.2M7.6 3.6 3.2 8l4.4 4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
        <button class="icon-btn" id="nav-forward" aria-label="Forward" title="Forward" disabled>
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 8h9.8M8.4 3.6 12.8 8l-4.4 4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
      </div>

      <div class="chip" id="chip-thread" hidden><span id="chip-thread-title"></span></div>
      <span class="spacer"></span>
      <button type="button" class="chip ops-hub-btn" id="open-ops-hub" title="Enterprise Rental Operations Hub (Fleet, Bookings, GST, DPDP, Workshop)">
        <span>Enterprise Ops Hub</span>
        <span class="pill warn" id="ops-alert-badge" hidden>0 alerts</span>
      </button>
    </header>

    <div class="notice-strip" id="notice-strip" hidden></div>

    <div class="stream" id="stream">
      <div class="column">

      <!-- The welcome. Rendered once per sign-in, then it scrolls away. -->
      <section class="greeting" id="greeting">
        <h2 id="g-headline">Hello.</h2>
        <p class="detail" id="g-detail"></p>
      </section>

        <div id="turns"></div>
      </div>
    </div>

    <!-- --------------------------------------------------------- composer -->
    <div class="composer-wrap">
      <div class="composer">
        <div class="composer-bar" id="attach-bar" hidden></div>
        <textarea id="input" rows="1" placeholder="Quote a 4-day SUV trip, draft a rental agreement, or check handover rules…"
                  aria-label="Message Float" spellcheck="true" autocomplete="off" data-lpignore="true" data-1p-ignore="true" data-form-type="other"></textarea>
        <div class="composer-bar">
          <button type="button" class="icon-btn plus" id="attach" data-pop title="Attach vehicle photo/doc, or open the rental toolkit" aria-label="Add">
            <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <input type="file" id="file-input" hidden multiple
                 accept="image/*,.pdf,.docx,.xlsx,.txt,.md,.csv">
          <span class="spacer"></span>
          <span class="composer-note" id="composer-note"></span>
          <button type="button" class="pick" id="chip-lens" data-pop title="Style: change how Float responds (Alt+L)"><span id="lens-label">Style</span></button>
          <button type="button" class="pick" id="chip-assist" title="How much Float does for you"><span id="assist-label">Draft it</span></button>
          <button type="button" class="pick" id="chip-model" title="Which model answers you"><span id="model-label">No key yet</span></button>
          <button type="button" class="icon-btn" id="mic" title="Dictate" aria-label="Dictate" hidden>
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="5.7" y="1.8" width="4.6" height="8" rx="2.3" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M3.4 7.6a4.6 4.6 0 0 0 9.2 0M8 12.2v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg>
          </button>
          <button type="button" class="send" id="send" aria-label="Send">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 13V3M3.6 7.2 8 2.8l4.4 4.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          </button>
        </div>
      </div>
      <div class="home-extras" id="home-extras">
        <div class="starters">
          <button type="button" class="starter" data-kit="lesson-plan">Rental agreement</button>
          <button type="button" class="starter" data-kit="question-paper">Handover checklist</button>
          <button type="button" class="starter" data-kit="worksheet">Instant quote</button>
          <button type="button" class="starter" data-kit="parent-message">Customer WhatsApp</button>
          <button type="button" class="starter" data-kit="marking">Damage &amp; deposit calc</button>
        </div>
        <div class="reflection" id="reflection" hidden>
          <b>This week</b>
          <span id="reflection-text"></span>
        </div>
      </div>
      <p class="composer-note">
        Float drafts contracts, quotes and checklists in seconds. Always verify plate numbers, odometer readings and DL details at handover.
      </p>
    </div>
  </main>

  <!-- ------------------------------------------------------------ drawer -->
  <div class="scrim" id="drawer-scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="Panel">
    <div class="drawer-head">
      <h3 id="drawer-title">Toolkit</h3>
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="drawer-close" aria-label="Close">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
</div>

<!-- -------------------------------------------------------------- modals -->
<div class="modal-scrim" id="modal-scrim" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h3 id="modal-title">Settings</h3>
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="modal-close" aria-label="Close">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<!-- ------------------------------------------------ enterprise ops modal -->
<div class="modal-scrim" id="ops-modal-scrim" hidden>
  <div class="modal ops-modal" id="ops-modal" role="dialog" aria-modal="true" aria-labelledby="ops-modal-title">
    <div class="modal-head">
      <h3 id="ops-modal-title">Enterprise Rental Operations Hub</h3>
      <span class="pill" id="ops-role-pill">owner</span>
      <span class="spacer"></span>
      <button type="button" class="icon-btn" id="ops-modal-close" aria-label="Close">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="tabs" id="ops-tabs" role="tablist" aria-label="Operations sections"></div>
    <div class="modal-body" id="ops-modal-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/secure.js"></script>
<script src="/app.js"></script>
</body>
</html>
